version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - APP_PASSWORD=${APP_PASSWORD}
      - ALLOWED_ORIGINS=http://localhost:3000
    volumes:
      - ./backend/chat.db:/app/chat.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=ws://localhost:8000
      - NEXT_PUBLIC_HTTP_API_URL=http://localhost:8000
      - NEXT_PUBLIC_APP_PASSWORD=${APP_PASSWORD}
    depends_on:
      - backend
    restart: unless-stopped

